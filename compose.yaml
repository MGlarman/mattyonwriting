services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: bookreviews
      POSTGRES_PASSWORD: bookreviews_local
      POSTGRES_DB: bookreviews
    volumes:
      - bookreviews_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookreviews -d bookreviews"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bookreviews_data:
